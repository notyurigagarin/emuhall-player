[package]
name = "emuhall-core-host"
version.workspace = true
edition.workspace = true
publish.workspace = true
license = "MIT"
build = "build.rs"

[build-dependencies]
cc = "1"

[dependencies]
anyhow.workspace = true
emuhall-player-runtime = { path = "../emuhall-player-runtime" }
serde_json.workspace = true
sha2.workspace = true
uuid.workspace = true
native-tls = "0.2"

# RetroAchievements requests and badge images where there is no WinHTTP/WIC (Linux); both already in the tree.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
png = "0.18"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
